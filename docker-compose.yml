version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: school_mgmt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_pass
      POSTGRES_DB: school_mgmt
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
